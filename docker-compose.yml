# One-command stack: Postgres + the Sentinel API (which also serves the dashboard).
#   docker compose up --build   ->   http://localhost:8000
# The Gemini key is read from your local .env (SENTINEL_GEMINI_API_KEY); without
# one, set SENTINEL_RISK_PROVIDER=mock to run fully offline.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/sentinel
      SENTINEL_RISK_PROVIDER: ${SENTINEL_RISK_PROVIDER:-auto}
      SENTINEL_GEMINI_API_KEY: ${SENTINEL_GEMINI_API_KEY:-}
      SENTINEL_CORS_ORIGINS: '["*"]'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
